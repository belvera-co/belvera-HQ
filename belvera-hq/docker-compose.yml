
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: belvera
      POSTGRES_PASSWORD: belvera_secret
      POSTGRES_DB: belvera_hq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://belvera:belvera_secret@db:5432/belvera_hq
      SECRET_KEY: belvera-hq-super-secret-key-change-in-production-2026
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
